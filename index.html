  ];
  download('modello-libreria-quadri.csv', '﻿' + rows.map(r => r.map(q).join(';')).join('\r\n'), 'text/csv');
}

// --- finestra di importazione
async function importTable() {
  const f = await pickFile('.xlsx,.xls,.xlsm,.ods,.csv,.txt');
  if (!f) return;
  let sheets;
  try { sheets = await readTableFile(f); } catch (e) { return toast('File non leggibile: ' + e.message); }
  sheets = sheets.filter(s => s.rows.length);
  if (!sheets.length) return toast('Il file non contiene righe');
  const si = Math.max(0, sheets.findIndex(s => findHeader(s.rows) >= 0));
  openImport({ name: f.name, sheets, si });
}

const keyOf = (brand, code) => normTxt(brand) + '|' + String(code ?? '').toUpperCase().replace(/[\s.\-/]/g, '');
const IMP_SHOW = 400;

function openImport(st) {
  const prep = () => {
    const rows = st.sheets[st.si].rows;
    st.hdr = findHeader(rows);
    const head = st.hdr >= 0 ? rows[st.hdr] : [];
    const width = Math.max(...rows.slice(0, 50).map(r => r.length), head.length);
    st.cols = Array.from({ length: width }, (_, i) => clean(head[i]) || 'Colonna ' + (i + 1));
    st.map = st.hdr >= 0 ? autoMap(head) : {};
    st.data = rows.slice(st.hdr + 1);
    st.over = {}; st.sel = {};
    st.brand = '';
    st.mode = 'update';
  };
  const compute = () => {
    const lib = new Map(state.library.filter(x => x.code).map(x => [keyOf(x.brand, x.code), x]));
    st.items = st.data.map((r, i) => {
      const { it, notes } = rowToItem(r, st.map, st.brand.trim());
      if (st.over[i]) { it.type = st.over[i]; if (!it.poles) it.poles = DEF_POLES[it.type]; if (!it.modules) it.modules = defaultMods(it.type, it.poles); }
      const empty = !it.code && !it.desc;
      const ex = it.code ? lib.get(keyOf(it.brand || 'Generico', it.code)) : null;
      const status = empty ? 'skip' : !it.type ? 'bad' : ex ? 'upd' : 'new';
      const sel = st.sel[i] ?? (status === 'new' || status === 'upd');
      return { i, it, notes, ex, status, sel: status === 'skip' || status === 'bad' ? false : sel };
    }).filter(x => x.status !== 'skip');
  };

  const w = document.createElement('div');
  w.className = 'modal';
  const close = () => { w.remove(); document.removeEventListener('keydown', key, true); };
  const key = e => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };

  const draw = () => {
    compute();
    const s = st.sheets[st.si];
    const nMap = Object.keys(st.map).length;
    const n = { new: 0, upd: 0, bad: 0 };
    st.items.forEach(x => n[x.status]++);
    const nSel = st.items.filter(x => x.sel && (x.status === 'new' || st.mode === 'update')).length;
    const colOpts = v => `<option value="-1">— non presente —</option>` + st.cols.map((c, i) => `<option value="${i}" ${v === i ? 'selected' : ''}>${esc(c)}</option>`).join('');
    const typeOpts = v => `<option value="">?</option>` + TYPE_ORDER.map(k => `<option value="${k}" ${v === k ? 'selected' : ''}>${esc(TYPES[k].short === '—' ? 'Vuoto' : TYPES[k].short)}</option>`).join('');
    const stTxt = x => x.status === 'new' ? '<span class="st-new">nuovo</span>'
      : x.status === 'upd' ? `<span class="st-upd">${st.mode === 'update' ? 'aggiorna' : 'già presente'}</span>`
      : '<span class="st-bad">tipo non riconosciuto</span>';
    const shown = st.items.slice(0, IMP_SHOW);
    w.innerHTML = `<div class="modal-box xl">
      <p><b>Importa articoli</b> – ${esc(st.name)}</p>
      <p class="small muted">${st.sheets.length > 1 ? `Foglio <select id="impSheet" style="width:auto">${st.sheets.map((x, i) => `<option value="${i}" ${i === st.si ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select> · ` : ''}
        ${st.items.length} righe lette · ${nMap} colonne riconosciute${st.hdr < 0 ? ' · <span class="warn-t">intestazioni non trovate: assegna le colonne qui sotto</span>' : ''}</p>
      <details ${nMap < 3 ? 'open' : ''}><summary>Colonne del file (${nMap} assegnate)</summary>
        <div class="imp-map">${IMP_FIELDS.map(([k, l]) => `<label>${esc(l)}<select data-map="${k}">${colOpts(st.map[k] ?? -1)}</select></label>`).join('')}</div>
      </details>
      <div class="imp-opts">
        <label>Marca per le righe senza marca<input id="impBrand" value="${esc(st.brand)}" placeholder="automatica (es. Siemens dal codice)"></label>
        <label>Se il codice esiste già<select id="impMode"><option value="update" ${st.mode === 'update' ? 'selected' : ''}>aggiorna i dati</option><option value="skip" ${st.mode === 'skip' ? 'selected' : ''}>salta</option></select></label>
        <span class="small"><span class="st-new">${n.new} nuovi</span> · <span class="st-upd">${n.upd} già presenti</span> · <span class="st-bad">${n.bad} da controllare</span></span>
      </div>
      <div class="imp-table"><table class="tbl">
        <thead><tr><th><input type="checkbox" id="impAll" ${st.items.length && st.items.every(x => x.sel || x.status === 'bad') ? 'checked' : ''}></th><th>Codice</th><th>Marca</th><th>Tipo</th><th>Poli</th><th>Mod</th><th>In</th><th>Curva</th><th>Idn</th><th>kA</th><th>Descrizione</th><th>Esito</th></tr></thead>
        <tbody>${shown.map(x => { const it = x.it; return `<tr>
          <td><input type="checkbox" data-sel="${x.i}" ${x.sel ? 'checked' : ''} ${x.status === 'bad' ? 'disabled' : ''}></td>
          <td>${esc(it.code)}</td><td>${esc(it.brand || 'Generico')}</td>
          <td><select data-type="${x.i}">${typeOpts(it.type)}</select></td>
          <td>${esc(it.poles)}</td><td>${esc(it.modules)}</td><td>${esc(it.In)}</td><td>${esc(it.curve)}</td>
          <td>${esc(idnText(it))}</td><td>${esc(it.Icn)}</td>
          <td title="${esc(it.desc)}">${esc(cut(it.desc, 46))}</td>
          <td>${stTxt(x)}${x.notes.length ? `<br><small class="muted">${esc(x.notes.join(', '))}</small>` : ''}</td></tr>`; }).join('')
          || '<tr><td colspan="12" class="muted">Nessuna riga con codice o descrizione.</td></tr>'}</tbody>
      </table></div>
      ${st.items.length > IMP_SHOW ? `<p class="small muted">Mostrate le prime ${IMP_SHOW} righe su ${st.items.length}: vengono importate tutte quelle valide.</p>` : ''}
      <div class="imp-foot"><span class="small muted">Le righe «da controllare» si importano dopo aver scelto il tipo.</span>
        <span class="grp"><button class="btn" data-r="close">Annulla</button><button class="btn primary" data-r="ok">Importa ${nSel} articoli</button></span></div>
    </div>`;
  };

  w.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'impSheet') { st.si = +t.value; prep(); }
    else if (t.dataset.map) {
      const k = t.dataset.map, v = +t.value;
      for (const f of Object.keys(st.map)) if (st.map[f] === v) delete st.map[f];
      if (v >= 0) st.map[k] = v; else delete st.map[k];
    }
    else if (t.id === 'impBrand') st.brand = t.value;
    else if (t.id === 'impMode') st.mode = t.value;
    else if (t.dataset.type) { const i = +t.dataset.type; if (t.value) { st.over[i] = t.value; st.sel[i] = true; } else delete st.over[i]; }
    else if (t.dataset.sel) st.sel[+t.dataset.sel] = t.checked;
    else if (t.id === 'impAll') st.items.forEach(x => { if (x.status !== 'bad') st.sel[x.i] = t.checked; });
    else return;
    const sc = w.querySelector('.imp-table')?.scrollTop || 0;
    const det = w.querySelector('details')?.open;
    draw();
    const tb = w.querySelector('.imp-table'); if (tb) tb.scrollTop = sc;
    const d2 = w.querySelector('details'); if (d2 && det != null) d2.open = det;
  });
  w.addEventListener('click', async e => {
    const r = e.target.closest('[data-r]')?.dataset.r;
    if (r === 'close' || e.target === w) return close();
    if (r !== 'ok') return;
    const todo = st.items.filter(x => x.sel && x.status !== 'bad' && (x.status === 'new' || st.mode === 'update'));
    if (!todo.length) return toast('Nessun articolo selezionato');
    const out = [];
    let nNew = 0, nUpd = 0, nDev = 0;
    for (const x of todo) {
      const it = { ...x.it, brand: x.it.brand || 'Generico', modules: modsOf(x.it) };
      if (x.ex) {
        const keep = x.ex;
        Object.assign(it, { id: keep.id, img: keep.img || '', url: it.url || keep.url || '', price: it.price !== '' ? it.price : (keep.price ?? '') });
        nUpd++;
      } else { it.id = uid(); nNew++; }
      out.push(it);
    }
    try { await db.putMany('library', out); }
    catch (err) { return toast('Errore salvataggio: ' + err.message); }
    state.library = await db.all('library');
    const byId = new Map(out.map(x => [x.id, x]));
    for (const p of state.projects) {
      let ch = false;
      p.devices.forEach(d => { const it = byId.get(d.libId); if (it && modsOf(d.item) === it.modules) { d.item = structuredClone(it); ch = true; nDev++; } });
      if (ch) { if (p === state.project) saveProject(); else db.put('projects', p); }
    }
    const brandsIn = [...new Set(out.map(x => x.brand))];
    state.lf = { q: '', type: '', brand: brandsIn.length === 1 ? brandsIn[0] : '' };
    close();
    render();
    toast(`Importati ${nNew} nuovi articoli${nUpd ? `, aggiornati ${nUpd}` : ''}${nDev ? ` (${nDev} dispositivi nei quadri)` : ''}`);
  });
  document.addEventListener('keydown', key, true);
  prep();
  draw();
  document.body.appendChild(w);
}

    <div class="proj-list">${list.map(p => `
      <div class="proj ${p.id === state.project.id ? 'current' : ''}" data-id="${p.id}">
        <div class="proj-txt"><b>${esc(p.name || 'Senza nome')}</b>${p.id === state.project.id ? ' <span class="tag blue">aperto</span>' : ''}
          <br><small class="muted">${esc(p.client)}${p.client ? ' · ' : ''}${p.devices.length} dispositivi · ${p.rows}×${p.mods} moduli · modificato ${new Date(p.updated).toLocaleString('it-IT')}</small></div>
        <div class="proj-act">
          <button class="btn small" data-a="open">Apri</button><button class="btn small" data-a="dup">Duplica</button>
          <button class="btn small" data-a="exp">Esporta ZIP</button><button class="btn small danger" data-a="del">Elimina</button>
        </div>
      </div>`).join('')}</div>`;
  $('#pNew').onclick = async () => {
    const p = newProject('Quadro ' + (state.projects.length + 1));
    await db.put('projects', p);
    state.projects.push(p);
    openProject(p);
    state.view = 'quadro';
    render();
    openProjectSheet();
  };
  $('#pImp').onclick = importFile;
  $('#pZip').onclick = exportFullZip;
  $('#pCloud').onclick = openCloudSheet;
  $$('.proj', main).forEach(row => $$('[data-a]', row).forEach(b => b.onclick = async () => {
    const p = state.projects.find(x => x.id === row.dataset.id);
    const a = b.dataset.a;
    if (a === 'open') { openProject(p); state.view = 'quadro'; render(); }
    if (a === 'dup') {
      const c = structuredClone(p);
      Object.assign(c, { id: uid(), name: p.name + ' (copia)', created: Date.now(), updated: Date.now() });
      await db.put('projects', c);
      state.projects.push(c);
      render();
    }
    if (a === 'exp') exportProjectZip(p);
    if (a === 'del') {
      if (!await ask(`Eliminare definitivamente il quadro «${p.name}»?`, 'Elimina')) return;
      await db.del('projects', p.id);
      state.projects = state.projects.filter(x => x.id !== p.id);
      if (state.project.id === p.id) {
        let next = state.projects[0];
        if (!next) { next = newProject(); await db.put('projects', next); state.projects.push(next); }
        openProject(next);
      }
      render();
    }
  }));
}

const JSZIP_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
const safeName = s => String(s || '').replace(/[\\/:*?"<>|\u0000-\u001f]+/g, '_').trim().slice(0, 80) || 'quadro';
const today = () => new Date().toISOString().slice(0, 10);

// copia completa dei dati (dalla memoria: è sempre aggiornata, anche durante la chiusura della pagina)
function backupData() {
  return { kind: 'quadri-backup', version: 1, savedAt: Date.now(), device: DEVICE, items: state.library, projects: state.projects };
}

async function makeZip(files) {
  const JSZip = await loadScript(JSZIP_URL, 'JSZip');
  const zip = new JSZip();
  for (const [name, text] of files) zip.file(name, text);
  return zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } });
}

async function exportProjectZip(p) {
  if (p === state.project) await flushProject();
  const json = JSON.stringify({ kind: 'quadri-project', version: 1, project: p }, null, 1);
  if (EMBEDDED) return download(`${safeName(p.name)}.json`, json);
  try { downloadBlob(`${safeName(p.name)}.zip`, await makeZip([[`${safeName(p.name)}.json`, json]])); }
  catch (e) { toast('ZIP non creato: ' + e.message); }
}

async function exportFullZip() {
  await flushProject();
  const data = backupData();
  if (EMBEDDED) return download(`backup-quadri-${today()}.json`, JSON.stringify(data));
  const used = new Set();
  const files = [['backup-completo.json', JSON.stringify(data)],
    ['libreria.json', JSON.stringify({ kind: 'quadri-library', version: 1, items: data.items })]];
  for (const p of data.projects) {
    let n = safeName(p.name), k = 2;
    while (used.has(n)) n = safeName(p.name) + ' (' + k++ + ')';
    used.add(n);
    files.push([`quadri/${n}.json`, JSON.stringify({ kind: 'quadri-project', version: 1, project: p }, null, 1)]);
  }
  try { downloadBlob(`backup-quadri-${today()}.zip`, await makeZip(files)); toast('Backup ZIP creato'); }
  catch (e) { toast('ZIP non creato: ' + e.message); }
}

async function readZip(f) {
  const JSZip = await loadScript(JSZIP_URL, 'JSZip');
  const zip = await JSZip.loadAsync(await f.arrayBuffer());
  const full = zip.file('backup-completo.json');
  if (full) return JSON.parse(await full.async('string'));
  const out = { items: [], projects: [] };
  for (const e of Object.values(zip.files)) {
    if (e.dir || !/\.json$/i.test(e.name)) continue;
    try {
      const d = JSON.parse(await e.async('string'));
      if (Array.isArray(d.items)) out.items.push(...d.items);
      if (d.project) out.projects.push(d.project);
      if (Array.isArray(d.projects)) out.projects.push(...d.projects);
    } catch { /* file non valido: ignorato */ }
  }
  return out;
}

async function importFile() {
  const f = await pickFile('.json,.zip,application/json,application/zip');
  if (!f) return;
  let data;
  try { data = /\.zip$/i.test(f.name) ? await readZip(f) : JSON.parse(await f.text()); }
  catch { return toast('File non valido'); }
  await importData(data);
}

async function importData(data) {
  let nItems = 0, nProj = 0;
  if (Array.isArray(data.items) && data.items.length) {
    await db.putMany('library', data.items);
    nItems = data.items.length;
    state.library = await db.all('library');
  }
  const projs = data.project ? [data.project] : Array.isArray(data.projects) ? data.projects : [];
  for (const p of projs) {
    const ex = state.projects.find(x => x.id === p.id);
    if (ex && !await ask(`Il quadro «${p.name}» esiste già.`, 'Sovrascrivi', 'Importa come copia')) {
      p.id = uid(); p.name += ' (importato)';
    }
    await db.put('projects', p);
    state.projects = state.projects.filter(x => x.id !== p.id).concat(p);
    if (state.project.id === p.id) state.project = p;
    nProj++;
  }
  if (!nItems && !nProj) return toast('Nessun dato riconosciuto nel file');
  toast(`Importati ${nItems ? nItems + ' articoli' : ''}${nItems && nProj ? ' e ' : ''}${nProj ? nProj + ' quadri' : ''}`);
  render();
}

// ---------------------------------------------------------------- SALVATAGGIO IN CLOUD (GitHub Gist privato)
const CLOUD_FILE = 'quadri-elettrici-backup.json';
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* archivio non disponibile */ } };
const DEVICE = lsGet('qe-device') || (() => { const d = uid(); lsSet('qe-device', d); return d; })();
const cloud = Object.assign({ token: '', gistId: '', login: '', auto: true, pushedAt: 0 }, lsGet('qe-cloud') || {});
const saveCloudCfg = () => lsSet('qe-cloud', cloud);
const cloudOn = () => !!(cloud.token && cloud.gistId);
let localChangedAt = lsGet('qe-changed') || 0;
let pushT = null, pushing = false, pushAgain = false, booting = true, retired = false, chipState = 'local', chipMsg = '';

function onDataChanged() {
  if (booting || retired) return;
  localChangedAt = Date.now();
  lsSet('qe-changed', localChangedAt);
  if (cloudOn() && cloud.auto) {
    setChip('dirty');
    clearTimeout(pushT);
    pushT = setTimeout(() => { pushT = null; cloudPush(); }, 3000);
  } else setChip('local');
}

const hhmm = t => new Date(t).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
function setChip(st, msg = '') {
  if (st === 'dirty' && !(cloudOn() && cloud.auto) && saveT === null) st = 'local';
  chipState = st; chipMsg = msg;
  const c = $('#saveChip'); if (!c) return;
  const txt = {
    local: cloudOn() && !cloud.auto ? '💾 Salvato sul dispositivo (cloud manuale)' : cloudOn() ? `☁ Salvato nel cloud ${cloud.pushedAt ? hhmm(cloud.pushedAt) : ''}` : '💾 Salvato sul dispositivo',
    dirty: '● Modifiche in corso…',
    saving: '☁ Salvataggio nel cloud…',
    cloud: `☁ Salvato nel cloud ${hhmm(cloud.pushedAt || Date.now())}`,
    offline: '☁ Offline: salvato sul dispositivo',
    err: '⚠ Errore cloud',
  }[st];
  c.textContent = txt;
  c.className = 'save-chip' + (st === 'err' ? ' err' : st === 'offline' ? ' warn' : '');
  c.title = msg || 'Stato del salvataggio: tocca per le impostazioni del cloud';
}

async function gh(path, opt = {}) {
  let r;
  try {
    r = await fetch('https://api.github.com' + path, {
      ...opt, cache: 'no-store',
      headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + cloud.token, 'X-GitHub-Api-Version': '2022-11-28',
        ...(opt.body ? { 'Content-Type': 'application/json' } : {}) },
    });
  } catch { const e = new Error('connessione assente'); e.offline = true; throw e; }
  if (!r.ok) {
    const e = new Error(r.status === 401 ? 'token non valido o scaduto' : r.status === 404 ? 'Gist non trovato (o token senza permesso «gist»)'
      : r.status === 403 ? 'accesso negato da GitHub (permessi del token o limite richieste)' : 'GitHub ha risposto ' + r.status);
    e.status = r.status;
    throw e;
  }
  return r.status === 204 ? null : r.json();
}

// Il backup nel cloud è diviso in 3 file: quadri (piccolo, inviato a ogni modifica),
// libreria e immagini (inviati solo quando cambiano). Così il salvataggio alla chiusura resta sotto i 64 kB.
const CF = { proj: 'qe-quadri.json', lib: 'qe-libreria.json', img: 'qe-immagini.json' };
const hashStr = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36) + s.length.toString(36); };

function splitBackup() {
  const imgs = {};
  const ref = v => { if (!v || !String(v).startsWith('data:')) return v; const h = hashStr(v); imgs[h] = v; return '#' + h; };
  const items = state.library.map(it => ({ ...it, img: ref(it.img) }));
  const projects = state.projects.map(p => ({ ...p, devices: p.devices.map(d => ({ ...d, item: { ...d.item, img: ref(d.item.img) } })) }));
  return { projects, items, imgs };
}
function joinBackup(projects, items, imgs) {
  const get = v => typeof v === 'string' && v.startsWith('#') ? (imgs[v.slice(1)] || '') : v;
  return {
    items: (items || []).map(it => ({ ...it, img: get(it.img) })),
    projects: (projects || []).map(p => ({ ...p, devices: (p.devices || []).map(d => ({ ...d, item: { ...d.item, img: get(d.item.img) } })) })),
  };
}

async function cloudFetch() {
  const g = await gh('/gists/' + cloud.gistId);
  const read = async f => {
    if (!f) return null;
    const text = f.truncated ? await (await fetch(f.raw_url, { cache: 'no-store' })).text() : f.content;
    try { return JSON.parse(text); } catch { return null; }
  };
  const fp = await read(g.files?.[CF.proj]);
  if (fp) {
    const [fl, fi] = await Promise.all([read(g.files[CF.lib]), read(g.files[CF.img])]);
    const out = joinBackup(fp.projects, fl?.items, fi?.imgs || {});
    return { kind: 'quadri-backup', version: 2, savedAt: fp.savedAt, device: fp.device, ...out };
  }
  return read(g.files?.[CLOUD_FILE]); // formato precedente (un solo file)
}

async function cloudPush(manual, closing) {
  if (!cloudOn() || retired) return;
  if (pushing) { pushAgain = true; return; }
  if (navigator.onLine === false) { setChip('offline'); if (manual) toast('Sei offline: i dati restano sul dispositivo'); return; }
  pushing = true;
  setChip('saving');
  try {
    clearTimeout(pushT); pushT = null;
    flushProject();
    const savedAt = Date.now();
    const { projects, items, imgs } = splitBackup();
    const parts = { lib: JSON.stringify({ items }), img: JSON.stringify({ imgs }) };
    const hashes = { lib: hashStr(parts.lib), img: hashStr(parts.img) };
    const files = { [CF.proj]: { content: JSON.stringify({ kind: 'quadri-cloud', version: 2, savedAt, device: DEVICE, projects }) } };
    let size = files[CF.proj].content.length;
    const sent = {};
    for (const k of ['lib', 'img']) {
      if (!manual && cloud.hashes?.[k] === hashes[k]) continue;
      if (closing && size + parts[k].length > 58000) continue; // alla chiusura: lo invio alla prossima apertura
      files[CF[k]] = { content: parts[k] };
      size += parts[k].length;
      sent[k] = true;
    }
    if (cloud.legacy !== false) files[CLOUD_FILE] = null; // elimina il vecchio file unico
    const body = JSON.stringify({ files });
    await gh('/gists/' + cloud.gistId, { method: 'PATCH', body, keepalive: !!closing && body.length < 63000 });
    cloud.hashes = { ...(cloud.hashes || {}) };
    for (const k of Object.keys(sent)) cloud.hashes[k] = hashes[k];
    cloud.legacy = false;
    const pending = ['lib', 'img'].some(k => cloud.hashes[k] !== hashes[k]);
    cloud.pushedAt = pending ? Math.min(savedAt, localChangedAt - 1) : savedAt;
    saveCloudCfg();
    setChip(localChangedAt > cloud.pushedAt ? 'dirty' : 'cloud');
    if (manual) toast('Salvato nel cloud');
  } catch (e) {
    if (e.status === 422 && cloud.legacy !== false) { cloud.legacy = false; saveCloudCfg(); pushAgain = true; } // file vecchio già assente: riprova
    setChip(e.offline ? 'offline' : 'err', e.message);
    if (manual) toast('Cloud: ' + e.message);
  } finally {
    pushing = false;
    if (pushAgain || (cloud.auto && localChangedAt > cloud.pushedAt && chipState === 'dirty' && !closing)) { pushAgain = false; pushT = setTimeout(() => { pushT = null; cloudPush(); }, 1500); }
  }
}

// sostituisce tutti i dati locali con quelli del backup (dal cloud)
async function replaceAll(data) {
  booting = true;
  try {
    await db.clear('library');
    await db.clear('projects');
    if (data.items?.length) await db.putMany('library', data.items);
    if (data.projects?.length) await db.putMany('projects', data.projects);
    state.library = await db.all('library');
    state.projects = await db.all('projects');
    const meta = (await db.get('meta', 'app')) || { id: 'app' };
    let p = state.projects.find(x => x.id === meta.last) || [...state.projects].sort((a, b) => b.updated - a.updated)[0];
    if (!p) { p = newProject('Il mio primo quadro'); await db.put('projects', p); state.projects.push(p); }
    saveT = null;
    openProject(p);
    cloud.pushedAt = data.savedAt || Date.now();
    if (data.version === 2) { const sb = splitBackup(); cloud.hashes = { lib: hashStr(JSON.stringify({ items: sb.items })), img: hashStr(JSON.stringify({ imgs: sb.imgs })) }; }
    else cloud.hashes = {};
    localChangedAt = cloud.pushedAt;
    lsSet('qe-changed', localChangedAt);
    saveCloudCfg();
  } finally { booting = false; }
  render();
  setChip('cloud');
}

const fmtDate = t => new Date(t).toLocaleString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
const sumTxt = d => `${d.projects?.length || 0} quadri, ${d.items?.length || 0} articoli`;

// all'avvio: se nel cloud c'è una versione più recente la propone
async function cloudSync() {
  if (!cloudOn() || retired || navigator.onLine === false) return;
  setChip('saving');
  let remote;
  try { remote = await cloudFetch(); }
  catch (e) { setChip(e.offline ? 'offline' : 'err', e.message); return; }
  const localDirty = localChangedAt > cloud.pushedAt;
  if (remote && remote.savedAt > cloud.pushedAt + 1000) {
    const msg = localDirty
      ? `Nel cloud c'è una versione del ${fmtDate(remote.savedAt)} (${sumTxt(remote)}) salvata da un altro dispositivo, ma anche qui ci sono modifiche non ancora salvate nel cloud. Quale vuoi tenere?`
      : `Nel cloud c'è una versione più recente, del ${fmtDate(remote.savedAt)} (${sumTxt(remote)}). Vuoi caricarla?`;
    if (await ask(msg, 'Usa quella del cloud', localDirty ? 'Tieni questa' : 'Non ora')) return replaceAll(remote);
    if (localDirty) return cloudPush();
    return setChip('local');
  }
  if (!remote || localDirty) return cloudPush();
  setChip('cloud');
}

async function cloudConnect(token) {
  cloud.token = token.trim();
  const me = await gh('/user');
  cloud.login = me.login || '';
  // cerca un backup già esistente (es. creato da un altro dispositivo)
  let found = null;
  for (let page = 1; page <= 5 && !found; page++) {
    const list = await gh(`/gists?per_page=100&page=${page}`);
    found = list.find(g => g.files && (g.files[CF.proj] || g.files[CLOUD_FILE]));
    if (list.length < 100) break;
  }
  if (found) {
    cloud.gistId = found.id;
    cloud.pushedAt = 0;
    cloud.hashes = {};
    cloud.legacy = !!found.files[CLOUD_FILE];
    saveCloudCfg();
    const remote = await cloudFetch();
    if (remote && await ask(`Nel tuo GitHub c'è già un backup del ${fmtDate(remote.savedAt)} (${sumTxt(remote)}). Vuoi caricarlo su questo dispositivo? Se scegli «Tieni questi», il backup nel cloud viene sostituito dai dati di questo dispositivo.`, 'Carica dal cloud', 'Tieni questi'))
      return replaceAll(remote);
    return cloudPush(true);
  }
  const g = await gh('/gists', { method: 'POST', body: JSON.stringify({ description: 'Quadri Elettrici – salvataggio automatico', public: false,
    files: { [CF.proj]: { content: JSON.stringify({ kind: 'quadri-cloud', version: 2, savedAt: Date.now(), device: DEVICE, projects: [] }) } } }) });
  cloud.gistId = g.id;
  cloud.legacy = false;
  cloud.hashes = {};
  saveCloudCfg();
  await cloudPush(true);
  toast('Cloud collegato: backup creato nel tuo GitHub');
}

        <li>In «Expiration» scegli la durata (es. «No expiration» o 1 anno). Il permesso <b>gist</b> è già spuntato: non selezionare altro.</li>
        <li>Premi «Generate token», copia il codice che inizia con <b>ghp_</b> e incollalo qui sotto.</li></ol></div>`}
    <div class="form">
      ${on ? '' : '<label class="wide">Token GitHub<input id="cTok" type="password" autocomplete="off" placeholder="ghp_…"></label>'}
      <label class="chk wide"><input type="checkbox" id="cAuto" ${cloud.auto ? 'checked' : ''}> Salva nel cloud in automatico a ogni modifica e alla chiusura</label>
    </div>
    <div class="actions">
      ${on ? '<button class="btn primary" id="cPush">Salva ora</button><button class="btn" id="cPull">Scarica dal cloud</button><button class="btn danger" id="cOff">Scollega</button>'
        : '<button class="btn primary" id="cOn">Collega</button>'}
    </div>
    <p class="cloud-st ${chipState === 'err' ? 'err' : on && chipState === 'cloud' ? 'ok' : ''}" id="cSt">${on
      ? (chipState === 'err' ? '⚠ ' + esc(chipMsg) : cloud.pushedAt ? '✔ Ultimo salvataggio nel cloud: ' + fmtDate(cloud.pushedAt) : 'Non ancora salvato nel cloud')
      : 'Cloud non collegato'}</p>
    <p class="note">Il token resta salvato solo in questo browser. Se lo perdi o lo revochi su GitHub, i dati restano nel Gist: basta crearne uno nuovo e ricollegarsi.</p>`);
  $('#cAuto').onchange = e => { cloud.auto = e.target.checked; saveCloudCfg(); if (cloud.auto && localChangedAt > cloud.pushedAt) cloudPush(); setChip(chipState); };
  $('#cOn') && ($('#cOn').onclick = async () => {
    const t = $('#cTok').value.trim();
    if (!t) return toast('Incolla il token di GitHub');
    $('#cOn').disabled = true;
    $('#cSt').textContent = 'Collegamento in corso…';
    try { await cloudConnect(t); openCloudSheet(); }
    catch (e) {
      cloud.token = ''; cloud.gistId = ''; saveCloudCfg();
      $('#cOn').disabled = false;
      $('#cSt').className = 'cloud-st err';
      $('#cSt').textContent = '⚠ ' + e.message;
    }
  });
  $('#cPush') && ($('#cPush').onclick = async () => { await cloudPush(true); openCloudSheet(); });
  $('#cPull') && ($('#cPull').onclick = async () => {
    try {
      const remote = await cloudFetch();
      if (!remote) return toast('Il backup nel cloud è vuoto');
      if (await ask(`Sostituire i dati di questo dispositivo con il backup del cloud del ${fmtDate(remote.savedAt)} (${sumTxt(remote)})?`, 'Sostituisci')) {
        await replaceAll(remote);
        toast('Dati caricati dal cloud');
      }
    } catch (e) { toast('Cloud: ' + e.message); }
  });
  $('#cOff') && ($('#cOff').onclick = async () => {
    if (!await ask('Scollegare il cloud da questo dispositivo? I dati restano qui e nel Gist.', 'Scollega')) return;
    Object.assign(cloud, { token: '', gistId: '', login: '', pushedAt: 0, hashes: {} });
    saveCloudCfg();
    setChip('local');
    openCloudSheet();
  });
}

// alla chiusura o quando l'app va in secondo piano: salva subito
const unsynced = () => cloudOn() && cloud.auto && (!!pushT || pushing || localChangedAt > cloud.pushedAt);
function saveNow() {
  if (retired) return;
  flushProject();
  if (unsynced() && !pushing) { clearTimeout(pushT); pushT = null; cloudPush(false, true); }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(); });
window.addEventListener('pagehide', saveNow);
window.addEventListener('beforeunload', e => {
  const pending = unsynced() && navigator.onLine !== false;
  saveNow();
  // chiede conferma solo se il salvataggio nel cloud non è ancora finito
  if (pending && !retired) { e.preventDefault(); e.returnValue = ''; }
});

// una sola scheda attiva: se l'app viene aperta in un'altra scheda, questa si ferma (niente sovrascritture)
const TAB_ID = uid();
let bc = null;
try { bc = new BroadcastChannel('quadri-elettrici'); } catch { /* browser senza BroadcastChannel */ }
function retireTab() {
  if (retired) return;
  flushProject();
  retired = true;
  clearTimeout(pushT);
  const w = document.createElement('div');
  w.className = 'modal';
  w.innerHTML = `<div class="modal-box"><p><b>App aperta in un'altra scheda</b></p>
    <p class="small muted">Per non sovrascrivere i dati, questa scheda è stata fermata. Usa l'altra scheda oppure ricarica questa per riprendere da qui.</p>
    <div class="actions"><button class="btn primary" data-r="reload">Ricarica qui</button></div></div>`;
  w.querySelector('[data-r=reload]').onclick = () => location.reload();
  document.body.appendChild(w);
}
if (bc) bc.onmessage = e => { if (e.data?.t === 'hello' && e.data.id !== TAB_ID) retireTab(); };

// aggiornamenti dell'app (GitHub Pages): controlla e propone di ricaricare
function showUpdate() {
  if ($('#updBar')) return;
  const b = document.createElement('div');
  b.id = 'updBar';
  b.className = 'toast';
  b.style.cssText = 'display:flex;gap:10px;align-items:center;bottom:20px';
  b.innerHTML = '<span>È disponibile una nuova versione dell\'app</span><button class="btn small primary">Aggiorna</button>';
  b.querySelector('button').onclick = async () => { await flushProject(); location.reload(); };
  document.body.appendChild(b);
}
async function setupUpdates() {
  if (EMBEDDED || !('serviceWorker' in navigator) || !location.protocol.startsWith('http')) return;
  const hadController = !!navigator.serviceWorker.controller;
  let reg;
  try { reg = await navigator.serviceWorker.register('sw.js'); } catch { return; }
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController) return; // prima installazione
    if (document.visibilityState === 'hidden') { flushProject(); location.reload(); } else showUpdate();
  });
  const check = () => reg.update().catch(() => {});
  setInterval(check, 15 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
}
window.addEventListener('online', () => { if (cloudOn() && cloud.auto && localChangedAt > cloud.pushedAt) cloudPush(); });
window.addEventListener('offline', () => { if (cloudOn()) setChip('offline'); });

function doPrint() {
  if (EMBEDDED) return toast('La stampa non è disponibile in questa pagina: usa la versione su GitHub');
  const p = state.project, res = computeAll(p), tg = tagMap(p);
  const M = Math.min(26, Math.floor(980 / (p.mods + 2)));
  $('#print-area').innerHTML = `
    <header class="ph"><h1>${esc(p.name)}</h1>
      <p>${esc([p.client, p.place].filter(Boolean).join(' – '))} · ${new Date().toLocaleDateString('it-IT')}<br>
      Alimentazione ${p.supply === '400' ? 'trifase 400 V' : 'monofase 230 V'}${num(p.icc) ? ' · Icc presunta ' + esc(p.icc) + ' kA' : ''}</p>
      ${p.notes ? `<p>${esc(p.notes)}</p>` : ''}</header>
    <h2>Fronte quadro</h2>${panelHTML(p, M, res, tg, false)}
    <h2 class="pb">Schema unifilare</h2>${unifilareSVG(p, res, tg)}
    <h2 class="pb">Distinta materiali</h2>${bomTables(p, tg)}`;
  setTimeout(() => window.print(), 400);
}

// ---------------------------------------------------------------- avvio
async function init() {
  state.library = await db.all('library');
  const meta = (await db.get('meta', 'app')) || { id: 'app' };
  if (!meta.seeded) {
    await db.putMany('library', SEED);
    state.library = await db.all('library');
    meta.seeded = true;
    await db.put('meta', meta);
  }
  state.projects = await db.all('projects');
  let p = state.projects.find(x => x.id === meta.last) || [...state.projects].sort((a, b) => b.updated - a.updated)[0];
  if (!p) { p = newProject('Il mio primo quadro'); await db.put('projects', p); state.projects.push(p); }
  openProject(p);

  $$('.tabs button').forEach(b => b.onclick = () => { state.view = b.dataset.view; state.placing = null; closeSheet(); render(); });
  $('#sheetClose').onclick = closeSheet;
  $('#bPrint').onclick = doPrint;
  $('#saveChip').onclick = openCloudSheet;
  document.addEventListener('keydown', e => {
    if ((e.key === 'Delete' || e.key === 'Backspace') && state.selected && state.view === 'quadro' &&
      !e.target.closest('input,select,textarea')) { e.preventDefault(); deleteDevice(state.selected); return; }
    if (e.key !== 'Escape') return;
    if (state.sheet) closeSheet();
    else if (state.placing) { state.placing = null; renderPalette(); renderPanel(); }
  });
  if (EMBEDDED) document.body.classList.add('embedded');
  render();
  booting = false;
  setChip(cloudOn() ? (localChangedAt > cloud.pushedAt ? 'dirty' : 'cloud') : 'local');
  if (isVolatile()) toast('Attenzione: questo browser non permette il salvataggio, i dati andranno persi alla chiusura');
  else if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
  bc?.postMessage({ t: 'hello', id: TAB_ID });
  cloudSync();
  setupUpdates();
}

init().catch(e => { document.body.innerHTML = `<p style="padding:20px">Errore di avvio: ${esc(e.message)}</p>`; console.error(e); });
</script>
</body></html>
